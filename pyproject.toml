[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ccreader"
version = "0.1.0"
description = "Terminal novel reader"
requires-python = ">=3.11"
dependencies = [
    "textual>=1.0",
    "rich>=13",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
ccreader = "ccreader.cli:main"

[tool.setuptools]
packages = ["ccreader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
